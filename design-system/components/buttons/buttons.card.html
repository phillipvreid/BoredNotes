<!-- @dsCard group="Components" viewport="700x340" name="Buttons" subtitle="Sticker CTA, send, ghost, dark, disabled + back/menu icon buttons" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:26px; background:var(--bn-paper); font-family:var(--bn-font-label); }
  .lab { font:700 10px/1 var(--bn-font-label); letter-spacing:1px; color:#9a958a; margin:0 0 12px; }
  .row { display:flex; gap:24px; align-items:center; flex-wrap:wrap; margin-bottom:26px; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../_loader.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/x-demo" data-deps="../buttons/Button.jsx,../buttons/IconButton.jsx">
  function Demo() {
    return (
      <div>
        <div className="lab">PRIMARY CTA — full width, lg</div>
        <div style={{ maxWidth: 360, marginBottom: 26 }}>
          <Button size="lg" block arrow>DUMP A THOUGHT</Button>
        </div>
        <div className="lab">SEND · GHOST · DARK · DISABLED · ICONS</div>
        <div className="row">
          <Button arrow>SEND IT</Button>
          <Button variant="ghost">CANCEL</Button>
          <Button variant="dark">DARK</Button>
          <Button disabled arrow>SEND IT</Button>
          <IconButton glyph="back" size={46} />
          <IconButton glyph="menu" size={46} />
        </div>
        <div className="lab">PRESS (TRANSLATE + HALVED SHADOW) IS BUILT IN — TAP TO FEEL IT</div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Demo));
</script>
</body>
</html>
