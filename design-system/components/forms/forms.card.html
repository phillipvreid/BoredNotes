<!-- @dsCard group="Components" viewport="760x460" name="Forms" subtitle="Answer textarea + heckling counter · rank podium · defend pad" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:26px; background:var(--bn-paper); font-family:var(--bn-font-label); }
  .lab { font:700 10px/1 var(--bn-font-label); letter-spacing:1px; color:#9a958a; margin:0 0 14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:30px; align-items:start; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../_loader.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/x-demo" data-deps="../forms/Textarea.jsx,../forms/RankSlot.jsx,../forms/DefendPad.jsx">
  function Demo() {
    const [v, setV] = React.useState("Reorganized my entire camera roll by vibe. Took two hours and it looks completely identical to before.");
    const [why, setWhy] = React.useState("Sam navigates by SMELL alone. That's a survival skill. Tony just yells.");
    return (
      <div className="grid">
        <div>
          <div className="lab">ANSWER TEXTAREA — TYPE TO MOVE THE HECKLE</div>
          <Textarea value={v} onChange={setV} />
        </div>
        <div>
          <div className="lab">RANK PODIUM</div>
          <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
            <RankSlot place={0} value="Toucan Sam" />
            <RankSlot place={1} value="Tony the Tiger" />
            <RankSlot place={2} placeholder="tap to fill #3" />
          </div>
          <div className="lab" style={{ margin:"22px 0 14px" }}>DEFEND PAD</div>
          <DefendPad value={why} onChange={setWhy} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Demo));
</script>
</body>
</html>
