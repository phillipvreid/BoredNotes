<!-- @dsCard group="Components" viewport="760x520" name="Cards" subtitle="Category prompt card · prompt sticker · saved hit cards (text / rank / brain)" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:26px; background:var(--bn-paper); font-family:var(--bn-font-label); }
  .lab { font:700 10px/1 var(--bn-font-label); letter-spacing:1px; color:#9a958a; margin:0 0 14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:30px; align-items:start; }
  .col-lab { margin:0 0 12px; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../_loader.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/x-demo" data-deps="../cards/CategoryCard.jsx,../cards/PromptSticker.jsx,../cards/HitCard.jsx">
    function Demo() {
      return (
        <div className="grid">
          <div>
            <div className="lab col-lab">CATEGORY CARDS (HOME)</div>
            <div style={{ display:"flex", flexDirection:"column", gap:13 }}>
              <CategoryCard cat="REFLECT" kind="introspect" color="var(--bn-cat-reflect)" tilt={-1.5}
                text="If your boredom had a sound, what is it?" />
              <CategoryCard cat="HOT TAKE" kind="opinion" color="var(--bn-cat-take)" tilt={1.2}
                text="A food everyone loves that's actually mid:" />
              <CategoryCard cat="CONFESS" kind="off record" color="var(--bn-cat-confess)" tilt={-1}
                text="The pettiest reason you've judged someone:" />
            </div>
            <div className="lab col-lab" style={{ marginTop:26 }}>PROMPT STICKER (REPLY)</div>
            <PromptSticker cat="REFLECT" color="var(--bn-cat-reflect)"
              text="If your boredom had a sound, what is it?" />
          </div>
          <div>
            <div className="lab col-lab">SAVED HITS — TEXT / RANK / BRAIN</div>
            <div style={{ display:"flex", flexDirection:"column", gap:13 }}>
              <HitCard cat="CONFESS" color="var(--bn-cat-confess)" when="wed · 4:03pm" tilt={-1}
                prompt="A thing you pretend to like:" answer="Hiking. It's just walking, but upset." />
              <HitCard type="rank" cat="RANK" color="var(--bn-cat-rank)" when="mon · 9:12am" tilt={1.1}
                prompt="Rank: best cereal mascots"
                items={["Toucan Sam", "Tony the Tiger", "Count Chocula"]}
                defense="Sam navigates by SMELL alone. Respect the bird." />
              <HitCard type="brain" cat="BRAIN DUMP" color="var(--bn-action)" chipFg="#141414" when="now" tilt={-0.6}
                answer="Reorganized my entire camera roll by vibe. Took two hours. Looks identical." />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Demo));
</script>
</body>
</html>
