<!-- @dsCard group="Colors" viewport="700x300" subtitle="Eight category hues — each owns one prompt category, all carry white text" name="Category hues" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--bn-paper); font-family:var(--bn-font-label); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .sw { }
  .chip { height:48px; border-radius:9px; border:2.5px solid var(--bn-ink); box-shadow:3px 3px 0 var(--bn-ink); }
  .lab { font:700 10px/1.3 var(--bn-font-label); letter-spacing:.5px; color:#56524a; margin-top:9px; }
  .hex { color:#9a958a; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--bn-cat-reflect)"></div><div class="lab">REFLECT<br><span class="hex">#2E5BFF · introspect</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--bn-cat-observe)"></div><div class="lab">OBSERVE<br><span class="hex">#06B6C9 · notice</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--bn-cat-confess)"></div><div class="lab">CONFESS<br><span class="hex">#8B3DF5 · off record</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--bn-cat-rank)"></div><div class="lab">RANK<br><span class="hex">#15A150 · micro-game</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--bn-cat-take)"></div><div class="lab">HOT TAKE<br><span class="hex">#FF7A1A · opinion</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--bn-cat-nostalgia)"></div><div class="lab">NOSTALGIA<br><span class="hex">#F5468C · rewind</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--bn-cat-gossip)"></div><div class="lab">HOT TEA<br><span class="hex">#FF4438 · gossip</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--bn-cat-imagine)"></div><div class="lab">IMAGINE<br><span class="hex">#6C5CE7 · what if</span></div></div>
  </div>
</body>
</html>
