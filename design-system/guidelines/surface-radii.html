<!-- @dsCard group="Surface" viewport="700x150" subtitle="6 chip · 11 button · 14–16 card · 20 sticker · 999 pill" name="Radius scale" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px; background:var(--bn-paper); font-family:var(--bn-font-label); display:flex; gap:18px; align-items:flex-end; }
  .box { width:64px; height:46px; background:var(--bn-paper-white); border:2.5px solid var(--bn-ink); }
  .lab { font:700 9px/1.2 var(--bn-font-label); color:#6a665d; margin-top:8px; text-align:center; }
</style>
</head>
<body>
  <div><div class="box" style="border-radius:6px"></div><div class="lab">6 · chip</div></div>
  <div><div class="box" style="border-radius:11px"></div><div class="lab">11 · button</div></div>
  <div><div class="box" style="border-radius:16px"></div><div class="lab">16 · card</div></div>
  <div><div class="box" style="border-radius:20px"></div><div class="lab">20 · sticker</div></div>
  <div><div class="box" style="border-radius:999px"></div><div class="lab">pill</div></div>
</body>
</html>
