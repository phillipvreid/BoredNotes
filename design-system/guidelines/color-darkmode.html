<!-- @dsCard group="Colors" viewport="700x180" subtitle="Dark mode inverts neutrals only — hues, yellow, mascot & medals stay identical" name="Dark mode neutrals" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:#0f0e0b; font-family:var(--bn-font-label); }
  .row { display:flex; gap:12px; }
  .sw { flex:1; }
  .chip { height:46px; border-radius:9px; border:2px solid #E8E2D2; }
  .lab { font:700 10px/1.3 var(--bn-font-label); letter-spacing:.5px; color:#9b988c; margin-top:9px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#1A1813"></div><div class="lab">PAPER · CREAM<br>#1A1813</div></div>
    <div class="sw"><div class="chip" style="background:#262320"></div><div class="lab">SURFACE<br>#262320</div></div>
    <div class="sw"><div class="chip" style="background:#1F1D18"></div><div class="lab">SHEET<br>#1F1D18</div></div>
    <div class="sw"><div class="chip" style="background:#F4EEDF;border:none"></div><div class="lab" style="color:#F4EEDF">TEXT<br>#F4EEDF</div></div>
    <div class="sw"><div class="chip" style="background:transparent;border:2px solid #E8E2D2"></div><div class="lab" style="color:#E8E2D2">BORDER<br>#E8E2D2 · shadow #000</div></div>
  </div>
</body>
</html>
