<!-- @dsCard group="Colors" viewport="700x180" subtitle="Yellow is reserved — it only ever means the action. One ink, two papers." name="Action & neutrals" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--bn-paper); font-family:var(--bn-font-label); }
  .row { display:flex; gap:12px; }
  .sw { flex:1; }
  .chip { height:48px; border-radius:9px; }
  .lab { font:700 10px/1.3 var(--bn-font-label); letter-spacing:.5px; color:#56524a; margin-top:9px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--bn-action);border:2.5px solid var(--bn-ink);box-shadow:3px 3px 0 var(--bn-ink)"></div><div class="lab">ACTION<br>#FFD23E</div></div>
    <div class="sw"><div class="chip" style="background:var(--bn-ink)"></div><div class="lab">INK<br>#141414</div></div>
    <div class="sw"><div class="chip" style="background:var(--bn-paper);border:2.5px solid var(--bn-ink)"></div><div class="lab">PAPER · CREAM<br>#FBFAF3</div></div>
    <div class="sw"><div class="chip" style="background:var(--bn-defend-pad);border:2.5px solid var(--bn-ink)"></div><div class="lab">DEFEND PAD<br>#FFF6D6</div></div>
    <div class="sw"><div class="chip" style="background:var(--bn-mascot);border:2.5px solid var(--bn-ink)"></div><div class="lab">MASCOT<br>#FF4438</div></div>
  </div>
</body>
</html>
