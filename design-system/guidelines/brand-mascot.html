<!-- @dsCard group="Brand" viewport="700x230" subtitle="The bored heckler — a CSS placeholder that bobs & blinks. Three sizes." name="Mascot" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px; background:var(--bn-paper); font-family:var(--bn-font-label); display:flex; gap:50px; align-items:flex-end; }
  @keyframes bob { 0%,100% { transform:translateY(0) rotate(-3deg) } 50% { transform:translateY(-7px) rotate(3deg) } }
  @keyframes blink { 0%,92%,100% { transform:scaleY(1) } 96% { transform:scaleY(.1) } }
  .lab { font:700 10px/1 var(--bn-font-label); letter-spacing:1px; color:#9a958a; margin-top:16px; text-align:center; }
  .eye { background:#fff; border:2px solid var(--bn-ink); border-radius:50%; overflow:hidden; animation:blink 5.5s infinite; }
  .pupil { position:absolute; background:var(--bn-ink); border-radius:50%; }
  .blob { position:absolute; inset:0; background:var(--bn-mascot); border:3px solid var(--bn-ink); border-radius:var(--bn-blob); }
</style>
</head>
<body>
  <div style="text-align:center">
    <div style="animation:bob 3s ease-in-out infinite;display:inline-block">
      <div style="position:relative;width:96px;height:87px">
        <div class="blob"></div>
        <div style="position:absolute;top:15px;left:22px;width:8px;height:3px;background:var(--bn-ink);border-radius:3px;transform:rotate(-22deg)"></div>
        <div style="position:absolute;top:15px;left:61px;width:8px;height:3px;background:var(--bn-ink);border-radius:3px;transform:rotate(22deg)"></div>
        <div class="eye" style="position:absolute;top:24px;left:22px;width:17px;height:17px"><div class="pupil" style="top:4px;left:5px;width:8px;height:8px"></div></div>
        <div class="eye" style="position:absolute;top:24px;left:54px;width:17px;height:17px"><div class="pupil" style="top:4px;left:5px;width:8px;height:8px"></div></div>
        <div style="position:absolute;top:50px;left:35px;width:24px;height:18px;background:var(--bn-ink);border-radius:0 0 12px 12px"></div>
        <div style="position:absolute;top:59px;left:41px;width:12px;height:8px;background:var(--bn-mascot-mouth);border-radius:0 0 8px 8px"></div>
      </div>
    </div>
    <div class="lab">IDLE · 96px (home)</div>
  </div>
  <div style="text-align:center">
    <div style="position:relative;width:50px;height:46px;display:inline-block">
      <div style="position:absolute;inset:0;background:var(--bn-action);border:2.5px solid var(--bn-ink);border-radius:var(--bn-blob)"></div>
      <div class="eye" style="position:absolute;top:15px;left:11px;width:11px;height:11px"><div class="pupil" style="top:3px;left:3px;width:5px;height:5px"></div></div>
      <div class="eye" style="position:absolute;top:15px;left:29px;width:11px;height:11px"><div class="pupil" style="top:3px;left:3px;width:5px;height:5px"></div></div>
      <div style="position:absolute;top:31px;left:19px;width:13px;height:9px;background:var(--bn-ink);border-radius:0 0 8px 8px"></div>
    </div>
    <div class="lab">PEEK · 50px (sticker)</div>
  </div>
  <div style="text-align:center">
    <div style="position:relative;width:30px;height:28px;display:inline-block">
      <div style="position:absolute;inset:0;background:var(--bn-mascot);border:2px solid #fff;border-radius:var(--bn-blob);box-shadow:0 0 0 2px var(--bn-ink)"></div>
      <div style="position:absolute;top:10px;left:7px;width:5px;height:5px;background:#fff;border-radius:50%"></div>
      <div style="position:absolute;top:10px;left:17px;width:5px;height:5px;background:#fff;border-radius:50%"></div>
      <div style="position:absolute;top:17px;left:10px;width:9px;height:4px;background:#fff;border-radius:0 0 5px 5px"></div>
    </div>
    <div class="lab">MINI · 30px (toast)</div>
  </div>
  <div style="max-width:150px;font:500 13px/1.5 var(--bn-font-body);color:#6a665d">Placeholder only. The production mascot should react to what you type.</div>
</body>
</html>
