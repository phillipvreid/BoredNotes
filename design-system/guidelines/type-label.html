<!-- @dsCard group="Type" viewport="700x190" subtitle="Space Mono 700 — wordmark, chips, status labels, counters, timestamps. UPPERCASE." name="Label · Space Mono" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px; background:var(--bn-paper); }
  .kicker { font:700 10px/1 var(--bn-font-label); letter-spacing:1px; color:var(--bn-cat-rank); }
  .lab { font-family:var(--bn-font-label); font-weight:700; color:var(--bn-ink); letter-spacing:1px; }
  .note { font:500 12px/1 var(--bn-font-body); color:#9a958a; margin-top:14px; }
</style>
</head>
<body>
  <div class="kicker">META · SPACE MONO · 700</div>
  <div style="display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-top:12px">
    <span class="lab" style="font-size:14px">PICK ONE, GENIUS ↓</span>
    <span class="lab" style="font-size:11px">REFLECT</span>
    <span class="lab" style="font-size:13px;color:var(--bn-text-muted-2)">37 BANGERS</span>
    <span class="lab" style="font-size:11px;color:var(--bn-text-placeholder)">wed · 4:03pm</span>
  </div>
  <div class="note">Status 14 · wordmark/counter 13 · chip 11 · card chip & section 10 — letter-spacing 0.5–2px</div>
</body>
</html>
